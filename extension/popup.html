<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>코레일 목록 확인</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header><span class="badge">읽기 전용 · 0.1</span><h1>열차 목록 확인</h1></header>
  <p class="intro">코레일에서 직접 조회한 뒤 아래 버튼을 누르세요.</p>
  <button id="read" type="button">현재 목록 읽기</button>
  <p id="status" role="status" aria-live="polite">준비되었습니다.</p>
  <section id="result" hidden>
    <h2 id="route"></h2>
    <p id="date"></p>
    <ul id="rows"></ul>
    <button id="save" type="button">진단 파일 저장</button>
    <details><summary>저장할 내용 확인</summary><pre id="preview"></pre></details>
  </section>
  <footer>날짜·구간·화면에 표시된 공개 목록만 읽습니다.<br>자동 조회·예약·결제·외부 전송은 하지 않습니다.</footer>
  <script type="module" src="popup.js"></script>
</body>
</html>
